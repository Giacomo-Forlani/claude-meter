name: macOS
on:
  push:
    branches: [main]
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: "Verifica su Intel e pubblica la versione indicata in Info.plist"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.publish && 'macos-15-intel' || 'macos-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test dei dati e delle impostazioni
        working-directory: macos
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library Plan.swift TokenHistory.swift Tests.swift -o "$RUNNER_TEMP/meter-tests"
          "$RUNNER_TEMP/meter-tests"
      - name: Compila e verifica l’app universale
        run: bash macos/build.sh
      - name: Verifica il pacchetto distribuito
        working-directory: dist/macos
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          ditto -x -k Claude-Meter-macOS.zip "$RUNNER_TEMP/app"
          bundle="$RUNNER_TEMP/app/Claude Meter.app"
          codesign --verify --strict "$bundle"
          lipo "$bundle/Contents/MacOS/ClaudeMeter" -verify_arch arm64 x86_64
          test "$(echo '{}' | "$bundle/Contents/MacOS/ClaudeMeter" --capture)" = Claude
          "$bundle/Contents/MacOS/ClaudeMeter" &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Meter-macOS
          path: dist/macos/*
          if-no-files-found: error

  release:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Claude-Meter-macOS
          path: dist/macos
      - name: Pubblica il pacchetto verificato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/macos
          sha256sum -c SHA256SUMS.txt
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("../../macos/Info.plist","rb"))["CFBundleShortVersionString"])')
          gh release create "macos-v$version" Claude-Meter-macOS.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Claude Meter $version per macOS" --notes-file ../../macos/ReleaseNotes.md
